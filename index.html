<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Windows Privacy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Awesome Windows Privacy</h1>
        <p>A list of awesome tools, documentation, and scripts for better privacy on Microsoft Windows</p>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </header>

    <!-- Content Sections -->
    <!-- ... (your content here) ... -->

    <footer>
        <p>Created by <a href="https://github.com/ArkoTest">ArkoTest</a></p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.classList.contains('light-theme') ? 'light' : 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.classList.remove(currentTheme + '-theme');
            body.classList.add(newTheme + '-theme');
        }
    </script>
</body>
</html>
